<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640">
  <!-- Source for docs/es/alarm-communicators/cellular/get/wiring-dsc-tip-ring.webp: Spanish version of get-dsc-tip-ring.svg.
       Title, keypad bus label and title weight follow the ES get/wiring-dsc.webp and its Paradox SP/MG keypad bus + TIP/RING drawing.
       Render with Scripts/wiring-diagrams/render.sh. Based on gt-plus-dsc-tip-ring.svg, with GET's terminal
       order from get/wiring-dsc.webp and get/wiring-control-panel-tip-ring.webp (TIP and RING at the bottom). -->
  <style>
    text { font-family: Calibri, Carlito, "Helvetica Neue", Arial, sans-serif; fill: #000; }
    .title { font-size: 26px; font-weight: 400; text-anchor: middle; }
    .b { font-weight: 700; }
    .brand { font-size: 46px; font-weight: 700; }
    .lbl { font-size: 23px; }
    .lbl-r { font-size: 23px; text-anchor: end; }
    .box { fill: #fff; stroke: #000; stroke-width: 2.5; }
    .cell { fill: #fff; stroke: #000; stroke-width: 2; }
    .screw { fill: none; stroke: #000; stroke-width: 2; }
    .wire { fill: none; stroke: #000; stroke-width: 5; stroke-linejoin: miter; stroke-linecap: butt; }
  </style>
  <rect width="760" height="640" fill="#fff"/>

  <text class="title" x="380" y="36">Diagrama de conexión de <tspan class="b">DSC</tspan> con <tspan class="b">GET</tspan></text>
  <text class="title" x="380" y="68">BUS de Datos y TIP/RING</text>

  <!-- DSC panel -->
  <rect class="box" x="10" y="100" width="270" height="510" rx="16"/>
  <text class="brand" x="30" y="150">DSC</text>
  <text class="lbl" transform="translate(66 235) rotate(-90)" text-anchor="middle">BUS de Datos</text>
  <line x1="228" y1="155" x2="228" y2="315" stroke="#000" stroke-width="2"/>
  <line x1="228" y1="515" x2="228" y2="595" stroke="#000" stroke-width="2"/>
  <g id="panel-terminals">
    <text class="lbl-r" x="218" y="183">RED</text>
    <text class="lbl-r" x="218" y="223">BLK</text>
    <text class="lbl-r" x="218" y="263">YEL</text>
    <text class="lbl-r" x="218" y="303">GRN</text>
    <text class="lbl-r" x="218" y="543">TIP</text>
    <text class="lbl-r" x="218" y="583">RING</text>
  </g>

  <!-- GET -->
  <rect class="box" x="540" y="150" width="210" height="460" rx="16"/>
  <text class="brand" transform="translate(728 232) rotate(-90)" text-anchor="middle">GET</text>
  <line x1="487" y1="155" x2="487" y2="595" stroke="#000" stroke-width="2"/>
  <g id="get-labels">
    <text class="lbl" x="548" y="183">&lt; + DC</text>
    <text class="lbl" x="548" y="223">&lt; - DC</text>
    <text class="lbl" x="548" y="263">&lt; CLK</text>
    <text class="lbl" x="548" y="303">&lt; DATA</text>
    <text class="lbl" x="548" y="343">&lt; I/O 1</text>
    <text class="lbl" x="548" y="383">&lt; I/O 2</text>
    <text class="lbl" x="548" y="423">&lt; COM</text>
    <text class="lbl" x="548" y="463">&lt; A RS485</text>
    <text class="lbl" x="548" y="503">&lt; B RS485</text>
    <text class="lbl" x="548" y="543">&lt; TIP</text>
    <text class="lbl" x="548" y="583">&lt; RING</text>
  </g>

  <!-- Wires: drawn before the terminals so the terminal cells sit on top of the wire ends -->
  <text class="lbl" x="296" y="164">(+12V)</text>
  <polyline class="wire" points="276,175 495,175"/>                       <!-- RED  -> +DC  -->
  <polyline class="wire" points="276,215 495,215"/>                       <!-- BLK  -> -DC  -->
  <polyline class="wire" points="276,255 495,255"/>                       <!-- YEL  -> CLK  -->
  <polyline class="wire" points="276,295 495,295"/>                       <!-- GRN  -> DATA -->
  <polyline class="wire" points="276,535 495,535"/>                       <!-- TIP  -> TIP  -->
  <polyline class="wire" points="276,575 495,575"/>                       <!-- RING -> RING -->

  <!-- Terminal cells: 40 x 40, a screw drawn as a circle with a slash -->
  <defs>
    <g id="t">
      <rect class="cell" x="-20" y="-20" width="40" height="40"/>
      <circle class="screw" cx="0" cy="0" r="12"/>
      <line class="screw" x1="-8.5" y1="8.5" x2="8.5" y2="-8.5"/>
    </g>
  </defs>
  <use href="#t" x="256" y="175"/>
  <use href="#t" x="256" y="215"/>
  <use href="#t" x="256" y="255"/>
  <use href="#t" x="256" y="295"/>
  <use href="#t" x="256" y="535"/>
  <use href="#t" x="256" y="575"/>

  <use href="#t" x="515" y="175"/>
  <use href="#t" x="515" y="215"/>
  <use href="#t" x="515" y="255"/>
  <use href="#t" x="515" y="295"/>
  <use href="#t" x="515" y="335"/>
  <use href="#t" x="515" y="375"/>
  <use href="#t" x="515" y="415"/>
  <use href="#t" x="515" y="455"/>
  <use href="#t" x="515" y="495"/>
  <use href="#t" x="515" y="535"/>
  <use href="#t" x="515" y="575"/>
</svg>
